<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>For Srishti ❤️</title>
<style>

body {

margin: 0;

font-family: 'Poppins', sans-serif;

background: linear-gradient(135deg, #ff758c, #ff7eb3);

color: #fff;

display: flex;

justify-content: center;

align-items: center;

min-height: 100vh;

overflow: hidden;

}

.card {

background: rgba(255, 255, 255, 0.15);

backdrop-filter: blur(10px);

border-radius: 20px;

padding: 30px;

width: 90%;

max-width: 420px;

text-align: center;

box-shadow: 0 20px 40px rgba(0,0,0,0.2);

}

h1 {

font-size: 2.2rem;

margin-bottom: 10px;

}

p {

font-size: 1rem;

line-height: 1.6;

}

button {

margin-top: 20px;

padding: 12px 24px;

border: none;

border-radius: 30px;

font-size: 1rem;

cursor: pointer;

background: #fff;

color: #ff4f81;

transition: transform 0.2s, box-shadow 0.2s;

}

button:hover {

transform: scale(1.05);

box-shadow: 0 10px 20px rgba(0,0,0,0.25);

}

.hidden { display: none; }

.heart {

position: absolute;

color: rgba(255,255,255,0.8);

font-size: 20px;

animation: float 6s linear infinite;

}

@keyframes float {

0% { transform: translateY(100vh) scale(0.8); opacity: 0; }

10% { opacity: 1; }

100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }

}

</head>
<body>


<div class="card" id="step1">
<h1>Hi Srishti ❤️</h1>
<p>
This little corner of the internet exists just for you.
Because some feelings are better coded than spoken.
</p>
<button onclick="nextStep()">Tap to Continue 💌</button>
</html>
